# Example values for Cloudian COSI Driver
s3:
  iamEndpoint: "https://iam.hyperstore.test:16443"
  s3Endpoint: "http://s3-region-1.hyperstore.test"
  region: "region-1"
  accessKey: "0a1b2c3d4e5f6g7h8i9j"
  secretAccessKey: "lkjhGFdsAPoiuYTreWQmnbVCxZlkjhGFdsAPoiuY+"
# Leave admin credentials empty to provision S3 keys through HyperStore IAM.
# Configure these only to use HyperStore users instead of IAM users.
admin:
  endpoint: ""
  username: ""
  password: ""
  group: ""
disableTLSCertificateCheck: false
existingS3CertificateSecret: ""
existingCredentialsSecret: ""
image:
  repository: quay.io/cloudian/cosi-driver
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  imagePullPolicy: IfNotPresent
sidecar:
  # Supply an image built from COSI commit 274540c69400dc1e13278b149a4e073339cefde2.
  # The old objectstorage-sidecar v1alpha1 image is not compatible.
  image:
    repository: ""
    tag: ""
    imagePullPolicy: IfNotPresent
  args:
    - --leader-elect=true
    - --metrics-bind-address=0
    - --health-probe-bind-address=:8081
    - --zap-devel=false
