# Example values for Cloudian COSI Driver
s3:
  iamEndpoint: "https://iam.hyperstore.test:16443"
  s3Endpoint: "http://s3-region-1.hyperstore.test"
  region: "region-1"
  accessKey: "0a1b2c3d4e5f6g7h8i9j"
  secretAccessKey: "lkjhGFdsAPoiuYTreWQmnbVCxZlkjhGFdsAPoiuY+"
# Use BucketAccessClass.authenticationType: IAM for IAM-generated S3 keys.
# Configure admin credentials only for authenticationType: Key (HyperStore users).
admin:
  endpoint: ""
  username: ""
  password: ""
  group: ""
disableTLSCertificateCheck: false
existingS3CertificateSecret: ""
existingCredentialsSecret: ""
image:
  repository: quay.io/cloudian/cosi-driver
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  imagePullPolicy: IfNotPresent
sidecar:
  # Supply a v1alpha1 sidecar image built from the COSI v0.2.2 release.
  # v1alpha2 sidecars are not compatible with this branch.
  image:
    repository: ""
    tag: ""
    imagePullPolicy: IfNotPresent
  args:
    - --driver-addr=unix:///var/lib/cosi/cosi.sock
    - --debug=false
    - --v=2
