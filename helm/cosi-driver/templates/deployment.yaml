---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudian-cosi-driver
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: cloudian-cosi-driver
    app.kubernetes.io/part-of: cloudian-cosi-driver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudian-cosi-driver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudian-cosi-driver
    spec:
      serviceAccountName: objectstorage-provisioner-sa
      securityContext:
        fsGroup: 65532
      containers:
        - name: cloudian-cosi-driver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: "{{ .Values.image.imagePullPolicy }}"
          command: ["/bin/sh", "-c"]
          args: ["umask 0007; exec /entrypoint.sh"]
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
{{ if .Values.existingS3CertificateSecret }}
            - mountPath: /usr/local/share/ca-certificates
              name: s3-certs
              readOnly: true
{{ end }}
          env:
          - name: S3_REGION
            value: {{ .Values.s3.region | quote }}
          - name: S3_ENDPOINT
            value: {{ .Values.s3.s3Endpoint | quote }}
          - name: IAM_ENDPOINT
            value: {{ .Values.s3.iamEndpoint | quote }}
{{- $admin := .Values.admin | default dict }}
{{- if $admin.endpoint }}
          - name: ADMIN_ENDPOINT
            value: {{ $admin.endpoint | quote }}
{{- end }}
          - name: DISABLE_TLS_CERTIFICATE_CHECK
            value: "{{ default false .Values.disableTLSCertificateCheck }}"
          envFrom:
          - secretRef:
              name: {{ .Values.existingCredentialsSecret | default "cloudian-cosi-secret" }}
        - name: objectstorage-driver-sidecar
          image: "{{ required "sidecar.image.repository must reference a COSI v1alpha2 sidecar image; see docs/quick-start.md" .Values.sidecar.image.repository }}:{{ required "sidecar.image.tag must identify a COSI v1alpha2 build compatible with commit 274540c69400" .Values.sidecar.image.tag }}"
          imagePullPolicy: "{{ .Values.sidecar.image.imagePullPolicy }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            {{- toYaml .Values.sidecar.args | nindent 12 }}
          env:
            - name: COSI_ENDPOINT
              value: unix:///var/lib/cosi/cosi.sock
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
      volumes:
        - name: socket
          emptyDir: {}
{{ if .Values.existingS3CertificateSecret }}
        - name: s3-certs
          secret:
            secretName: {{ .Values.existingS3CertificateSecret }}
{{ end }}
